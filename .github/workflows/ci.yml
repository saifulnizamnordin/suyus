name: CI

# Build check for every pull request to main. This is the check to require in the branch ruleset:
# unlike "Validate portfolio submission" (which only runs when portfolio or showcase files change),
# it runs on every PR, so a required check never waits for a job that doesn't start.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
