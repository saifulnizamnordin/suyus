name: Sync portfolio usernames

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-usernames
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check every portfolio against GitHub
        run: node scripts/sync-usernames.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sure the site still builds
        run: npm run build

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/sync-usernames
          delete-branch: true
          add-paths: src/content/portfolios/**
          commit-message: Sync portfolio usernames with GitHub accounts
          title: Sync portfolio usernames with GitHub accounts
          body-path: sync-report.md
          labels: automated
